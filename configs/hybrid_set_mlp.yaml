model: hybrid
max_tokens_per_gene: 32

tokenizer:
  position_bin_size: 25
  max_position_bins: 512
  signature_buckets: 4096

model_params:
  embedding_dim: 24
  token_dim: 96
  gene_dim: 128
  sample_dim: 256
  classifier_hidden: [256]
  dense_hidden: 256
  fusion_hidden: [384, 192]
  dropout: 0.15

training:
  epochs: 35
  batch_size: 64
  learning_rate: 0.0007
  weight_decay: 0.0001
  gradient_clip: 1.0
  class_weight: true
  num_workers: 0
